steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "-f"
      - "dockerfile"
      - "."

  # Push the Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "3000"
      - "--memory"
      - "${_MEMORY}"
      - "--cpu"
      - "${_CPU}"
      - "--min-instances"
      - "${_MIN_INSTANCES}"
      - "--max-instances"
      - "${_MAX_INSTANCES}"
      - "--timeout"
      - "${_TIMEOUT}"
      - "--concurrency"
      - "${_CONCURRENCY}"
      - "--set-env-vars"
      - "NODE_ENV=production"
      - "--set-secrets"
      - "X_API_KEY_FOR_ORDER_LISTING=X_API_KEY_FOR_ORDER_LISTING:latest,ERP_CLIENT_ID=ERP_CLIENT_ID:latest,GSTIN_X_API_KEY=GSTIN_X_API_KEY:latest,X_API_KEY_FOR_REGISTRATION=X_API_KEY_FOR_REGISTRATION:latest,X_API_KEY_FOR_LOGIN=X_API_KEY_FOR_LOGIN:latest"

# Substitution variables with defaults
substitutions:
  _REGION: "asia-south1"
  _REPOSITORY: "experience-middleware"
  _SERVICE_NAME: "experience-middleware"
  _MEMORY: "512Mi"
  _CPU: "1"
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "4"
  _TIMEOUT: "300"
  _CONCURRENCY: "80"
  _CMS_ASSETS_BUCKET_URL: "https://storage.googleapis.com/public-jsw-msme-cms-storage-prod-service"
  _CMS_ASSETS_CDN_URL: "https://internal-assets.jswonemsme.com"

# Images to be pushed to Artifact Registry
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
