services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: coroot-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: coroot_vff21rkl
      CLICKHOUSE_USER: coroot
      CLICKHOUSE_PASSWORD: coroot123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"    # native TCP
      - "8123:8123"    # HTTP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q 'Ok.'"]
      interval: 5s
      timeout: 3s
      retries: 60  

  prometheus:
    image: prom/prometheus:latest
    container_name: coroot-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Coroot UI (reads traces/metrics; does NOT receive OTLP in this setup)
  coroot:
    image: ghcr.io/coroot/coroot:latest
    container_name: coroot
    restart: unless-stopped
    depends_on:
      - clickhouse
      - prometheus
    environment:

      CLICKHOUSE_URL: clickhouse://coroot:coroot123@clickhouse:9000/coroot_vff21rkl

      PROMETHEUS_URL: http://prometheus:9090

      #GLOBAL_CLICKHOUSE_ADDRESS: clickhouse:9000
      GLOBAL_CLICKHOUSE_USER: coroot
      #GLOBAL_CLICKHOUSE_PASSWORD: coroot123
      #GLOBAL_CLICKHOUSE_INITIAL_DATABASE: coroot_vff21rkl
      #GLOBAL_PROMETHEUS_URL: http://prometheus:9090
      #GLOBAL_REFRESH_INTERVAL: 15s
    ports:
      - "8080:8080"
    volumes:
      - coroot-data:/data

  # Redis for caching
  #redis:
  #  image: redis:7-alpine
  #  container_name: redis
  #  restart: unless-stopped
  #  ports:
  #    - "6379:6379"
  #  command: redis-server --appendonly yes
  #  volumes:
  #    - redis-data:/data
  #  healthcheck:
  #    test: ["CMD", "redis-cli", "ping"]
  #    interval: 5s
  #    timeout: 3s
  #    retries: 5

  # REAL OTel Collector (receives OTLP on 4317/4318, writes to ClickHouse)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  coroot-data:
  redis-data:
